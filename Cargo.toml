[workspace]
members = [
    "crates/rlex",
    "crates/rlex-viz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/repolex-ai/rlex"

[workspace.dependencies]
oxigraph = "0.5"
json-ld = "0.21"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
actix-web = "4"
actix-files = "0.6"
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
toml = "0.8"
toml_edit = "0.22"
walkdir = "2"
flate2 = "1"
urlencoding = "2"
regex = "1"
