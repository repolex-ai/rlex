name: Release

# Builds ready-to-run rlex binaries and attaches them to a GitHub release, so
# install.sh can install rlex without Rust or a compiler.
# Run it by pushing a tag: git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p rlex --target "$TARGET"
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/rlex-${TARGET}.tar.gz" -C "target/${TARGET}/release" rlex
      - uses: actions/upload-artifact@v4
        with:
          name: rlex-${{ matrix.target }}
          path: dist/rlex-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "rlex $TAG" --notes "Install: curl -fsSL https://raw.githubusercontent.com/repolex-ai/rlex/main/install.sh | sh"
